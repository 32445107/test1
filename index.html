
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    /* ページ全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 155px;
      font-family: "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", sans-serif;
      line-height: 1.8;
      color: #65564f;
      background-color: #fffaf4;
    }

    /* ヘッダー */
    header {
      position: relative;
      min-height: 120px;
      overflow: hidden;
      padding: 30px 20px;
      text-align: center;
      color: #795b50;
      background-color: #f8deda;
      border-bottom: 4px solid #f2c6c1;
      animation: fadeInDown 0.9s ease-out both;
    }

    header h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      position: relative;
      z-index: 2;
      margin: 8px 0 0;
      color: #896e62;
    }

    /* ヘッダーの飾り */
    .decoration {
      position: absolute;
      display: block;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      line-height: 1;
      opacity: 1;
      visibility: visible;
    }

    /* ハート */
    .heart {
      color: #d88f9c;
      font-size: 22px;
      animation: heartFloat 4s ease-in-out infinite;
    }

    .heart-one {
      top: 12px;
      left: 8%;
      animation-delay: 0s;
    }

    .heart-two {
      right: 8%;
      bottom: 12px;
      color: #e5a7ae;
      font-size: 19px;
      animation-delay: 1.2s;
    }

    .heart-three {
      top: 18px;
      right: 28%;
      color: #c9919b;
      font-size: 15px;
      animation-delay: 2s;
    }

    /* 星 */
    .star {
      color: #c79b45;
      font-size: 21px;
      animation: starTwinkle 3.5s ease-in-out infinite;
    }

    .star-one {
      top: 12px;
      left: 25%;
      animation-delay: 0.5s;
    }

    .star-two {
      right: 20%;
      top: 15px;
      font-size: 17px;
      animation-delay: 1.6s;
    }

    .star-three {
      left: 18%;
      bottom: 12px;
      font-size: 15px;
      animation-delay: 2.2s;
    }

    /* 毛糸玉 */
    .yarn {
      font-size: 27px;
      animation: yarnRoll 5s ease-in-out infinite;
    }

    .yarn-one {
      left: 3%;
      bottom: 10px;
      animation-delay: 0.3s;
    }

    .yarn-two {
      right: 3%;
      top: 10px;
      font-size: 23px;
      animation-delay: 1.5s;
    }

    /* ハートがふわふわ動く */
    @keyframes heartFloat {
      0%, 100% {
        transform: translateY(0) rotate(-8deg);
      }

      50% {
        transform: translateY(-10px) rotate(8deg);
      }
    }

    /* 星がきらきら動く */
    @keyframes starTwinkle {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scale(0.9);
        opacity: 0.55;
      }

      50% {
        transform: translateY(-7px) rotate(25deg) scale(1.15);
        opacity: 1;
      }
    }

    /* 毛糸玉がころころ揺れる */
    @keyframes yarnRoll {
      0%, 100% {
        transform: translateY(0) rotate(-12deg);
      }

      50% {
        transform: translateY(-7px) rotate(12deg);
      }
    }

    /* メインコンテンツ */
    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 25px;
      padding: 25px;
      background-color: #fffdf9;
      border: 1px solid #f3e7dc;
      border-radius: 18px;
      box-shadow: 0 4px 12px #a68b7612;
      animation: fadeInUp 0.8s ease-out both;
    }

    /* セクションが少しずつ登場 */
    main > section:nth-child(1) {
      animation-delay: 0.15s;
    }

    main > section:nth-child(2) {
      animation-delay: 0.3s;
    }

    main > section:nth-child(3) {
      animation-delay: 0.45s;
    }

    main > section:nth-child(4) {
      animation-delay: 0.6s;
    }

    section h2 {
      margin-top: 0;
      margin-bottom: 15px;
      padding: 8px 14px;
      color: #795b50;
      background-color: #fbe9e5;
      border-radius: 12px;
      font-size: 22px;
    }

    /* セクションごとのパステルカラー */
    section:nth-child(2) h2 {
      background-color: #e8f0e3;
    }

    section:nth-child(3) h2 {
      background-color: #eee8f7;
    }

    section:nth-child(4) h2 {
      background-color: #fff0cf;
    }

    section p {
      margin: 10px 0;
    }

    /* 制作物一覧 */
    .works-intro {
      margin-bottom: 22px;
      color: #927b70;
      font-size: 14px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    /* 作品カード */
    .work-card {
      min-width: 0;
      overflow: hidden;
      padding: 10px;
      background-color: #ffffff;
      border: 1px solid #f1dfd5;
      border-radius: 16px;
      box-shadow: 0 4px 10px #a68b7618;
      transition: transform 0.3s ease,
                  box-shadow 0.3s ease;
    }

    /* カードが浮き上がる */
    .work-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 22px #a68b7628;
    }

    .work-card:focus-within {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px #a68b7628;
    }

    /* 作品画像 */
    .work-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 11px;
      background-color: #f8eee5;
      border: 4px solid #fff8f0;
    }

    .work-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .work-card:hover .work-image img {
      transform: scale(1.04);
    }

    /* 作品の説明 */
    .work-info {
      padding: 10px 3px 5px;
    }

    .work-tag {
      display: inline-block;
      padding: 2px 8px;
      color: #9c7770;
      background-color: #fbeae6;
      border-radius: 20px;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .work-info h3 {
      margin: 8px 0;
      color: #795b50;
      font-size: 15px;
      line-height: 1.6;
    }

    /* 制作予定リスト */
    .project-list {
      padding-left: 25px;
    }

    .project-list li {
      margin: 8px 0;
      padding-left: 5px;
    }

    .project-list li::marker {
      color: #d9a49b;
    }

    /* リンク */
    a {
      color: #8b7770;
      text-decoration: none;
    }

    a:hover {
      color: #c27e79;
      text-decoration: underline;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 15px;
      text-align: center;
      color: #ffffff;
      background-color: #9db9a6;
      font-size: 13px;
      line-height: 1.7;
      box-shadow: 0 -3px 12px #a68b7610;
      z-index: 100;
    }

    footer p {
      margin: 0 0 3px;
    }

    footer nav {
      margin-bottom: 3px;
    }

    footer a {
      margin: 0 7px;
      color: #ffffff;
    }

    footer a:hover {
      color: #fff2d8;
    }

    footer small {
      color: #f8fff8;
    }

    /* ヘッダーの登場 */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* セクションの登場 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* タブレット */
    @media (max-width: 700px) {
      .works-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .heart-one {
        left: 8%;
      }

      .star-one {
        left: 25%;
      }

      .heart-three {
        right: 23%;
      }
    }

    /* スマートフォン */
    @media (max-width: 600px) {
      body {
        padding-bottom: 145px;
      }

      header {
        padding: 22px 15px;
      }

      header h1 {
        font-size: 26px;
      }

      main {
        margin: 20px auto;
        padding: 0 14px;
      }

      section {
        padding: 18px;
        border-radius: 14px;
      }

      section h2 {
        font-size: 19px;
      }

      footer {
        padding: 10px 8px;
        font-size: 12px;
      }

      footer a {
        margin: 0 4px;
      }

      .heart {
        font-size: 18px;
      }

      .star {
        font-size: 17px;
      }

      .yarn {
        font-size: 22px;
      }
    }

    /* 小さいスマートフォン */
    @media (max-width: 400px) {
      .works-grid {
        grid-template-columns: 1fr;
      }

      .work-card {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
      }

      .work-image {
        aspect-ratio: 1 / 1;
      }

      .work-info {
        padding: 5px 0;
      }

      .heart-three,
      .star-three {
        display: none;
      }
    }

    /* 動きを少なくする設定への配慮 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .work-card:hover,
      .work-card:focus-within {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <!-- ハート・星・毛糸玉の飾り -->
    <span class="decoration heart heart-one" aria-hidden="true">♥</span>
    <span class="decoration star star-one" aria-hidden="true">✦</span>
    <span class="decoration heart heart-two" aria-hidden="true">♡</span>
    <span class="decoration star star-two" aria-hidden="true">✧</span>
    <span class="decoration heart heart-three" aria-hidden="true">♥</span>
    <span class="decoration star star-three" aria-hidden="true">✦</span>
    <span class="decoration yarn yarn-one" aria-hidden="true">🧶</span>
    <span class="decoration yarn yarn-two" aria-hidden="true">🧶</span>

    <h1>My Website</h1>

  </header>

  <!-- メインコンテンツ -->
  <main>

    <section>

        このサイトは初心者が編み物で制作物を作る過程を記録するサイトです。
      </p>
    </section>

    <!-- 制作物一覧 -->

      <p class="works-intro">

      </p>

      <div class="works-grid">

        <article class="work-card">

        <!-- ワッフル模様のポーチ -->

          <div class="work-info">

        </article>

        <!-- 耳当て -->
        <article class="work-card">
          <div class="work-image">
            <img
              src="https://raw.githubusercontent.com/32445107/test1/main/%E8%80%B3%E5%BD%93%E3%81%A6.jpg"
              alt="白い犬の顔がついた耳当て"
              loading="lazy">
          </div>
          <div class="work-info">
            <span class="work-tag">HANDMADE</span>
            <h3>耳当て</h3>
          </div>
        </article>

      </div>
    </section>

    <!-- 参考にさせていただいたページ -->
    <section>
      <h2>参考にさせていただいたページ</h2>
      <p>ーーーーーーーー</p>
    </section>

    <!-- 制作予定のもの -->
    <section>
      <h2>制作予定のもの</h2>

      <div class="works-grid">

        <!-- 花束 -->
        <article class="work-card">
          <div class="work-image">
            <img
              src="https://raw.githubusercontent.com/32445107/test1/main/%E8%8A%B1%E6%9D%9F.jpg"
              alt="制作予定の花束"
              loading="lazy">

          <div class="work-info">
            <span class="work-tag">COMING SOON</span>
            <h3>花束</h3>
          </div>
        </article>

      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>
      お問い合わせ：
      <a href="mailto:info@example.com">info@example.com</a>
    </p>

    <nav aria-label="ソーシャルメディア">
      <a href="https://www.instagram.com/"

  </footer>

</body>
</html>
