
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    /* ページ全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 155px;
      font-family: "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", sans-serif;
      line-height: 1.8;
      color: #65564f;
      background-color: #fffaf4;
    }

    /* ヘッダー */
    header {
      padding: 30px 20px;
      text-align: center;
      color: #795b50;
      background-color: #f8deda;
      border-bottom: 4px solid #f2c6c1;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      margin: 8px 0 0;
      color: #896e62;
    }

    /* メインコンテンツ */
    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 25px;
      padding: 25px;
      background-color: #fffdf9;
      border: 1px solid #f3e7dc;
      border-radius: 18px;
      box-shadow: 0 4px 12px #a68b7612;
    }

    section h2 {
      margin-top: 0;
      margin-bottom: 15px;
      padding: 8px 14px;
      color: #795b50;
      background-color: #fbe9e5;
      border-radius: 12px;
      font-size: 22px;
    }

    /* セクションごとのパステルカラー */
    section:nth-child(2) h2 {
      background-color: #e8f0e3;
    }

    section:nth-child(3) h2 {
      background-color: #eee8f7;
    }

    section:nth-child(4) h2 {
      background-color: #fff0cf;
    }

    section p {
      margin: 10px 0;
    }

    /* 制作物一覧 */
    .works-intro {
      margin-bottom: 22px;
      color: #927b70;
      font-size: 14px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    /* 小窓のようなカード */
    .work-card {
      min-width: 0;
      overflow: hidden;
      padding: 10px;
      background-color: #ffffff;
      border: 1px solid #f1dfd5;
      border-radius: 16px;
      box-shadow: 0 4px 10px #a68b7618;
      transition: transform 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .work-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px #a68b7628;
    }

    /* 画像 */
    .work-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 11px;
      background-color: #f8eee5;
      border: 4px solid #fff8f0;
    }

    .work-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .work-card:hover .work-image img {
      transform: scale(1.04);
    }

    /* 作品の説明 */
    .work-info {
      padding: 10px 3px 5px;
    }

    .work-tag {
      display: inline-block;
      padding: 2px 8px;
      color: #9c7770;
      background-color: #fbeae6;
      border-radius: 20px;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .work-info h3 {
      margin: 8px 0;
      color: #795b50;
      font-size: 15px;
      line-height: 1.6;
    }

    /* リスト */
    .project-list {
      padding-left: 25px;
    }

    .project-list li {
      margin: 8px 0;
      padding-left: 5px;
    }

    .project-list li::marker {
      color: #d9a49b;
    }

    /* リンク */
    a {
      color: #8b7770;
      text-decoration: none;
    }

    a:hover {
      color: #c27e79;
      text-decoration: underline;
    }

    /* フッターを画面下部に固定 */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 15px;
      text-align: center;
      color: #ffffff;
      background-color: #9db9a6;
      font-size: 13px;
      line-height: 1.7;
      box-shadow: 0 -3px 12px #a68b7610;
      z-index: 100;
    }

    footer p {
      margin: 0 0 3px;
    }

    footer nav {
      margin-bottom: 3px;
    }

    footer a {
      margin: 0 7px;
      color: #ffffff;
    }

    footer a:hover {
      color: #fff2d8;
    }

    footer small {
      color: #f8fff8;
    }

    /* タブレット対応 */
    @media (max-width: 700px) {
      .works-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
    }

    /* スマートフォン対応 */
    @media (max-width: 600px) {
      body {
        padding-bottom: 145px;
      }

      header {
        padding: 22px 15px;
      }

      header h1 {
        font-size: 26px;
      }

      main {
        margin: 20px auto;
        padding: 0 14px;
      }

      section {
        padding: 18px;
        border-radius: 14px;
      }

      section h2 {
        font-size: 19px;
      }

      footer {
        padding: 10px 8px;
        font-size: 12px;
      }

      footer a {
        margin: 0 4px;
      }
    }

    /* 小さいスマートフォンでは横長カード */
    @media (max-width: 400px) {
      .works-grid {
        grid-template-columns: 1fr;
      }

      .work-card {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
      }

      .work-image {
        aspect-ratio: 1 / 1;
      }

      .work-info {
        padding: 5px 0;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>My Website</h1>
    <p>編み物制作集</p>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <section>
      <h2>ようこそ！</h2>
      <p>
        このサイトは初心者が編み物で制作物を作る過程を記録するサイトです。
      </p>
    </section>

    <!-- 制作物一覧 -->
    <section class="works-section">
      <h2>制作物一覧</h2>
      <p class="works-intro">
        ひとつずつ心を込めて作った作品たちです 🧶
      </p>

      <div class="works-grid">

        <!-- コースター -->
        <article class="work-card">
          <div class="work-image">
            <img
              src="https://raw.githubusercontent.com/32445107/test1/1e7f8f26e21a4d5d40eeaa0628f030509121d0f4/%E3%82%B3%E3%83%BC%E3%82%B9%E3%82%BF%E3%83%BC.jpg"
              alt="コースター"
              loading="lazy">
          </div>
          <div class="work-info">
            <span class="work-tag">HANDMADE</span>
            <h3>コースター</h3>
          </div>
        </article>

        <!-- ワッフル模様のポーチ -->
        <article class="work-card">
          <div class="work-image">
            <img
              src="https://raw.githubusercontent.com/32445107/test1/main/%E3%83%9D%E3%83%BC%E3%83%81.jpg"
              alt="ワッフル模様のポーチ"
              loading="lazy">
          </div>
          <div class="work-info">
            <span class="work-tag">HANDMADE</span>
            <h3>ワッフル模様のポーチ</h3>
          </div>
        </article>

        <!-- 耳当て -->
        <article class="work-card">
          <div class="work-image">
            <img
              src="https://raw.githubusercontent.com/32445107/test1/main/%E8%80%B3%E5%BD%93%E3%81%A6.jpg"
              alt="白い犬の顔がついた耳当て"
              loading="lazy">
          </div>
          <div class="work-info">
            <span class="work-tag">HANDMADE</span>
            <h3>耳当て</h3>
          </div>
        </article>

      </div>
    </section>

    <!-- 参考にさせていただいたページ -->
    <section>
      <h2>参考にさせていただいたページ</h2>
      <p>
        ーーーーーーーー
      </p>
    </section>

    <!-- 制作予定のもの -->
    <section>
      <h2>制作予定のもの</h2>

      <div class="works-grid">

        <!-- 花束 -->
        <article class="work-card">
          <div class="work-image">
            <img
              src="https://raw.githubusercontent.com/32445107/test1/main/%E8%8A%B1%E6%9D%9F.jpg"
              alt="制作予定の花束"
              loading="lazy">
          </div>
          <div class="work-info">
            <span class="work-tag">COMING SOON</span>
            <h3>花束</h3>
          </div>
        </article>

      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>
      お問い合わせ：
      <a href="mailto:info@example.com">
        info@example.com
      </a>
    </p>

    <nav aria-label="ソーシャルメディア">
      <a href="https://www.instagram.com/"
         target="_blank" rel="noopener noreferrer">Instagram</a>
      |
      <a href="https://x.com/"
         target="_blank" rel="noopener noreferrer">X</a>
      |
      <a href="https://www.facebook.com/"
         target="_blank" rel="noopener noreferrer">Facebook</a>
    </nav>

    <small>&copy; 2026 My Website</small>
  </footer>

</body>
</html>
